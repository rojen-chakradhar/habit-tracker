<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1 class="logo"><a href="index.html">habit tracker</a></h1>
      <nav>
        <div class="date">
          <p>wed, jun 10</p>
        </div>
        <div class="new btn"><i class="ri-add-line icon"></i> new habbit</div>
      </nav>
    </header>
    <main>
      <div class="container">
        <div class="content">
          <h3 class="title">today's progress</h3>
          <p class="num">0/0</p>
          <span>habits completed</span>
        </div>
        <div class="content">
          <h3 class="title">best streak</h3>
          <p class="num">0</p>
          <span>days in a row</span>
        </div>
        <div class="content">
          <h3 class="title">weekly rate</h3>
          <p class="num">0%</p>
          <span>completion rate</span>
        </div>
      </div>
      <div class="habits">
        <p>your habits</p>
        <div class="habit">
          <div class="top">
            <div class="left">
              <h2>Morning run</h2>
              <p>daily</p>
            </div>
            <div class="right">
              <i class="ri-water-line"></i>
              <p>0</p>
              <div class="tick">
                <i class="ri-tick-line"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="./scripts/script.js"></script>
  </body>
</html>
