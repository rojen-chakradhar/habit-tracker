<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <a href="index.html"><h1 class="logo">habit tracker</h1></a>
      <nav>
        <div class="date-pill" id="datePill">sun jan 1</div>
        <button class="btn-add" id="openModal"><i class="ri-add-line"></i> new habit</button>
      </nav>
    </header>
    <main>
      <div class="summary">
        <div class="stat-card">
          <h3 class="stat-label">today's progress</h3>
          <p class="stat-value" id="stat-Progress">0/0</p>
          <p class="stat-sub" id="statProgressSub">habits completed</p>
        </div>
        <div class="stat-card">
          <h3 class="stat-label">best streak</h3>
          <p class="stat-value" id="stat-Progress">0</p>
          <p class="stat-sub" id="statProgressSub">days in a row</p>
        </div>
        <div class="stat-card">
          <h3 class="stat-label">weekly rate</h3>
          <p class="stat-value" id="stat-Progress">0%</p>
          <p class="stat-sub" id="statProgressSub">completion rate</p>
        </div>
      </div>
      <h3 class="section-label">your habits</h3>
      <div class="habits-list"></div>
      <div class="empty-state" id="emptyState">
        <i class="ri-inbox-line empty-icon"></i>
        <p class="empty-title">nothing tracked yet</p>
        <p class="empty-sub">Add your first bait to start building your streak.</p>
      </div>
    </main>
    <div class="modla-overlay" id="modalOverlay">
      <div class="modal">
        <h2>new habit</h2>
        <div class="field">
          <label>name</label>
          <input type="text" id="habitName" placeholder="e.g. Wake Up, Morking Walk, Read...">
        </div>
        <div class="field">
          <label>icon</label>
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>
        <div class="field">
          <label>frequency</label>
          <select id="habitFreq">
            <option value="daily">daily</option>
            <option value="weekdays">weekdays</option>
            <option value="weekends">weekends</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="closeModal">cancel</button>
          <button class="btn-save" id="saveHabit">add habit</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast">dsf</div>
    <script src="./scripts/script.js"></script>
  </body>
</html>
